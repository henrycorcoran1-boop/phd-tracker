<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#4EC0CA">
<title>Flappy Byrd</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#1a1a2e;font-family:'Trebuchet MS','Century Gothic',sans-serif;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  #wrap{display:flex;align-items:center;justify-content:center;height:100dvh;width:100vw;}
  #game{position:relative;box-shadow:0 0 40px rgba(0,0,0,.5);border-radius:6px;overflow:hidden;}
  canvas{display:block;background:#4EC0CA;touch-action:none;}
  #hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:rgba(255,255,255,.85);
    font-size:12px;letter-spacing:.5px;text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none;}
</style>
</head>
<body>
<div id="wrap"><div id="game">
  <canvas id="c"></canvas>
  <div id="hint">tap / click / space to flap</div>
</div></div>
<script>
(function(){
  "use strict";

  var W = 400, H = 640;
  var canvas = document.getElementById('c');
  var hint = document.getElementById('hint');
  canvas.width = W; canvas.height = H;
  var ctx = canvas.getContext('2d');

  function fitToScreen(){
    var maxW = window.innerWidth, maxH = window.innerHeight;
    var scale = Math.min(maxW / W, maxH / H, 1.6);
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
  }
  window.addEventListener('resize', fitToScreen);
  fitToScreen();

  var GROUND_H = 90;
  var GRAVITY = 0.42;
  var FLAP_VELOCITY = -7.6;
  var MAX_FALL = 11;
  var PIPE_W = 62;
  var PIPE_GAP = 158;
  var PIPE_SPEED = 2.6;
  var PIPE_INTERVAL = 95; // frames between pipes

  var BEST_KEY = 'flappyByrdBest';
  var best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);

  var STATE = { READY: 0, PLAYING: 1, DEAD: 2 };
  var state = STATE.READY;

  var bird, pipes, frame, score, groundX, flashTimer;

  function reset(){
    bird = { x: W * 0.3, y: H * 0.42, vy: 0, r: 14, rot: 0 };
    pipes = [];
    frame = 0;
    score = 0;
    groundX = 0;
    flashTimer = 0;
    state = STATE.READY;
    hint.style.display = 'block';
    hint.textContent = 'tap / click / space to flap';
  }

  function flap(){
    if (state === STATE.READY){
      state = STATE.PLAYING;
      hint.style.display = 'none';
    }
    if (state === STATE.PLAYING){
      bird.vy = FLAP_VELOCITY;
    }
    if (state === STATE.DEAD){
      reset();
    }
  }

  function spawnPipe(){
    var margin = 60;
    var gapY = margin + Math.random() * (H - GROUND_H - margin * 2 - PIPE_GAP);
    pipes.push({ x: W + PIPE_W, gapY: gapY, passed: false });
  }

  function rectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){
    return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
  }

  function circleRectCollide(cx,cy,cr,rx,ry,rw,rh){
    var nearestX = Math.max(rx, Math.min(cx, rx+rw));
    var nearestY = Math.max(ry, Math.min(cy, ry+rh));
    var dx = cx - nearestX, dy = cy - nearestY;
    return (dx*dx + dy*dy) < (cr*cr);
  }

  function update(){
    if (state === STATE.PLAYING){
      frame++;
      bird.vy = Math.min(bird.vy + GRAVITY, MAX_FALL);
      bird.y += bird.vy;
      bird.rot = Math.max(-0.5, Math.min(1.3, bird.vy / 10));

      if (frame % PIPE_INTERVAL === 0) spawnPipe();

      for (var i = pipes.length - 1; i >= 0; i--){
        var p = pipes[i];
        p.x -= PIPE_SPEED;

        if (!p.passed && p.x + PIPE_W < bird.x - bird.r){
          p.passed = true;
          score++;
        }

        if (circleRectCollide(bird.x, bird.y, bird.r*0.8, p.x, 0, PIPE_W, p.gapY) ||
            circleRectCollide(bird.x, bird.y, bird.r*0.8, p.x, p.gapY + PIPE_GAP, PIPE_W, H)){
          die();
        }

        if (p.x + PIPE_W < 0) pipes.splice(i, 1);
      }

      if (bird.y + bird.r*0.8 > H - GROUND_H){
        bird.y = H - GROUND_H - bird.r*0.8;
        die();
      }
      if (bird.y - bird.r < 0){
        bird.y = bird.r;
        bird.vy = 0;
      }
    }

    if (state !== STATE.DEAD || frame % 2 === 0){
      groundX -= (state === STATE.PLAYING ? PIPE_SPEED : 0);
      if (groundX <= -24) groundX += 24;
    }

    if (flashTimer > 0) flashTimer--;
  }

  function die(){
    if (state === STATE.DEAD) return;
    state = STATE.DEAD;
    flashTimer = 6;
    if (score > best){
      best = score;
      localStorage.setItem(BEST_KEY, String(best));
    }
  }

  function drawBackgroundClouds(){
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    for (var i = 0; i < 4; i++){
      var cx = ((i * 130) - (frame * 0.15) % 130 + 520) % 520 - 60;
      var cy = 60 + (i % 2) * 70;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 30, 14, 0, 0, Math.PI*2);
      ctx.ellipse(cx+22, cy+4, 22, 11, 0, 0, Math.PI*2);
      ctx.ellipse(cx-20, cy+6, 20, 10, 0, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function drawPipe(p){
    var lipH = 26;
    ctx.fillStyle = '#74BF2E';
    ctx.strokeStyle = '#4A8A1B';
    ctx.lineWidth = 3;

    // top pipe
    ctx.fillRect(p.x, 0, PIPE_W, p.gapY);
    ctx.strokeRect(p.x+1.5, 0, PIPE_W-3, p.gapY);
    ctx.fillRect(p.x-4, p.gapY - lipH, PIPE_W+8, lipH);
    ctx.strokeRect(p.x-4+1.5, p.gapY - lipH, PIPE_W+8-3, lipH-1.5);

    // bottom pipe
    var by = p.gapY + PIPE_GAP;
    var bh = (H - GROUND_H) - by;
    ctx.fillRect(p.x, by, PIPE_W, bh);
    ctx.strokeRect(p.x+1.5, by, PIPE_W-3, bh);
    ctx.fillRect(p.x-4, by, PIPE_W+8, lipH);
    ctx.strokeRect(p.x-4+1.5, by+1.5, PIPE_W+8-3, lipH-3);
  }

  function drawGround(){
    ctx.fillStyle = '#DED895';
    ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
    ctx.fillStyle = '#8B5E34';
    ctx.fillRect(0, H - GROUND_H, W, 8);
    ctx.fillStyle = '#C7C06B';
    for (var x = groundX; x < W; x += 24){
      ctx.fillRect(x, H - GROUND_H + 8, 14, GROUND_H - 8);
    }
  }

  function drawBird(){
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot * 0.6);

    ctx.fillStyle = '#FFD447';
    ctx.strokeStyle = '#C48A16';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, bird.r, bird.r*0.82, 0, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();

    // wing
    ctx.fillStyle = '#FFB100';
    ctx.beginPath();
    var wingFlap = state === STATE.PLAYING ? Math.sin(frame*0.4)*3 : 0;
    ctx.ellipse(-3, 3+wingFlap, 8, 5, -0.3, 0, Math.PI*2);
    ctx.fill();

    // eye
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(6, -5, 4.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(7.5, -5, 2.2, 0, Math.PI*2); ctx.fill();

    // beak
    ctx.fillStyle = '#FF7A1E';
    ctx.strokeStyle = '#C4570F';
    ctx.beginPath();
    ctx.moveTo(bird.r-2, -2);
    ctx.lineTo(bird.r+8, 1);
    ctx.lineTo(bird.r-2, 5);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    ctx.restore();
  }

  function drawScore(){
    ctx.textAlign = 'center';
    ctx.font = '900 42px Trebuchet MS, sans-serif';
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(0,0,0,.35)';
    ctx.fillStyle = '#fff';
    ctx.strokeText(String(score), W/2, 70);
    ctx.fillText(String(score), W/2, 70);
  }

  function drawCenterPanel(title, sub){
    var pw = 260, ph = 150;
    var px = W/2 - pw/2, py = H/2 - ph/2 - 20;
    ctx.fillStyle = 'rgba(20,20,30,.82)';
    ctx.strokeStyle = 'rgba(255,255,255,.25)';
    ctx.lineWidth = 2;
    roundRect(px, py, pw, ph, 14);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = '900 22px Trebuchet MS, sans-serif';
    ctx.fillText(title, W/2, py + 40);

    ctx.font = '700 15px Trebuchet MS, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.fillText('Score: ' + score, W/2, py + 82);
    ctx.fillText('Best: ' + best, W/2, py + 108);

    ctx.font = '600 12px Trebuchet MS, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.fillText(sub, W/2, py + 134);
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function render(){
    ctx.clearRect(0,0,W,H);

    var grad = ctx.createLinearGradient(0,0,0,H-GROUND_H);
    grad.addColorStop(0, '#7DDCE8');
    grad.addColorStop(1, '#4EC0CA');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H-GROUND_H);

    drawBackgroundClouds();

    for (var i=0;i<pipes.length;i++) drawPipe(pipes[i]);

    drawGround();
    drawBird();

    if (state === STATE.PLAYING) drawScore();
    if (state === STATE.READY) drawCenterPanel('Flappy Byrd', 'tap to start');
    if (state === STATE.DEAD) drawCenterPanel('Game Over', 'tap to try again');

    if (flashTimer > 0){
      ctx.fillStyle = 'rgba(255,255,255,' + (flashTimer/6*0.6) + ')';
      ctx.fillRect(0,0,W,H);
    }
  }

  function loop(){
    update();
    render();
    requestAnimationFrame(loop);
  }

  canvas.addEventListener('pointerdown', function(e){ e.preventDefault(); flap(); });
  window.addEventListener('keydown', function(e){
    if (e.code === 'Space' || e.code === 'ArrowUp'){ e.preventDefault(); flap(); }
  });

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
