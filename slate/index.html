<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf8f4">
<title>Slate — project management for teams</title>
<meta name="description" content="Plan projects, assign work, set deadlines and track progress across boards, tables, calendars and a real Gantt timeline.">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='2' width='20' height='20' rx='5' fill='%231a1815'/%3E%3Cpath d='M7.5 12.4 10.6 15.5 16.5 8.8' fill='none' stroke='white' stroke-width='2.1' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="manifest" href="./manifest.webmanifest">

<link rel="stylesheet" href="./assets/css/tokens.css">
<link rel="stylesheet" href="./assets/css/base.css">
<link rel="stylesheet" href="./assets/css/app.css">
<link rel="stylesheet" href="./assets/css/views.css">

<script>
  /* Set the theme before first paint so the app never flashes white. */
  (function () {
    try {
      var raw = localStorage.getItem('slate.v1:meta:prefs');
      var theme = raw ? (JSON.parse(raw) || {}).theme : 'system';
      var dark = theme === 'dark'
        || ((!theme || theme === 'system')
          && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.querySelector('meta[name="theme-color"]')
        .setAttribute('content', dark ? '#14120f' : '#faf8f4');
    } catch (e) { /* first run, or storage blocked */ }
  })();
</script>
</head>
<body>

<div id="root"></div>

<div class="boot">
  <svg class="boot__mark" width="34" height="34" viewBox="0 0 24 24" fill="none"
       stroke="#1a1815" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="18" height="18" rx="5"></rect>
    <path d="M8 12.5 11 15.5 16.5 9"></path>
  </svg>
</div>

<noscript>
  <div style="max-width:520px;margin:14vh auto;padding:0 24px;font:15px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1a1815">
    <h1 style="font-size:22px;letter-spacing:-0.02em">Slate needs JavaScript</h1>
    <p style="color:#5e584e">This is an interactive application — boards, timelines and editing all run in the browser. Please enable JavaScript to continue.</p>
  </div>
</noscript>

<script type="module" src="./assets/js/app/main.js"></script>
</body>
</html>
