[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infrabid-estimator"
version = "0.1.0"
description = "Machine-learning order-of-magnitude estimating for tender and pricing documents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Arya Estimating" }]
keywords = ["estimating", "tender", "bill of quantities", "construction", "quantity surveying"]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "joblib>=1.3",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
pdf = ["pdfplumber>=0.10"]
dev = ["pytest>=7.4"]

[project.scripts]
infrabid-estimator = "infrabid_estimator.cli:main"

[tool.setuptools.packages.find]
include = ["infrabid_estimator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
